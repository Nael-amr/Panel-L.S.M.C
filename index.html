
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSMC | Panel EMS</title>
  <style>
    body {
      margin: 0;
      background: #0b1120;
      color: #edf3fc;
      font-family: Arial, sans-serif;
    }
    header {
      background: #131d30;
      padding: 24px;
      border-bottom: 1px solid #26344a;
    }
    header h1 { margin: 0; color: #60a5fa; }
    main { padding: 30px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .card {
      background: #131d30;
      border: 1px solid #26344a;
      border-radius: 12px;
      padding: 22px;
    }
    .number { font-size: 32px; margin-top: 12px; }
    .muted { color: #91a2bb; }
  </style>
</head>
<body>
  <header>
    <h1>LSMC — EMS</h1>
    <p class="muted">Panel de gestion hospitalière</p>
  </header>
  <main>
    <h2>Tableau de bord</h2>
    <p class="muted">Bienvenue sur le panel de ton hôpital.</p>
    <div class="cards">
      <div class="card">
        <div class="muted">Employés</div>
        <div class="number">0</div>
      </div>
      <div class="card">
        <div class="muted">Véhicules</div>
        <div class="number">0</div>
      </div>
      <div class="card">
        <div class="muted">Grades</div>
        <div class="number">0</div>
      </div>
      <div class="card">
        <div class="muted">En service</div>
        <div class="number">0</div>
      </div>
    </div>
  </main>
</body>
</html>
